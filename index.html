<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MEM — Header Demo</title>
  <style>
    :root{
      --bg:#0f1220; --card:#1a1e2e; --ink:#f5f7fb; --muted:#a7adc5; --brand:#7c5cff;
      --ring: rgba(124,92,255,.35);
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#0b0e1a, #121630 40%, #0f1220);color:var(--ink);font:500 16px/1.5 system-ui, Inter, Segoe UI, Roboto, Helvetica, Arial}
    a{color:inherit;text-decoration:none}
    .container{max-width:1200px;margin:0 auto;padding:0 16px}
    /* Header */
    .site-header{position:sticky;top:0;z-index:50;background:rgba(15,18,32,.7);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
    .nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:700}
    .brand img{width:28px;height:28px;border-radius:8px;display:block}
    .navlinks{display:flex;align-items:center;gap:20px}
    .navlinks a{color:var(--muted)}
    .navlinks a:hover{color:var(--ink)}
    .cta{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px var(--ring)}
    .cta:active{transform:translateY(1px)}
    /* Mobile */
    .burger{display:none;background:transparent;border:0;color:var(--ink);font-size:18px}
    @media (max-width:880px){
      .navlinks{display:none}
      .burger{display:inline-flex}
      .drawer{position:fixed;inset:64px 0 auto 0;background:var(--card);border-top:1px solid rgba(255,255,255,.08);display:none}
      .drawer.open{display:block}
      .drawer .inner{padding:16px}
      .drawer a{display:block;padding:12px 8px;color:var(--muted)}
      .drawer a:hover{color:var(--ink)}
    }
    /* Demo hero so widać, że działa */
    .hero{padding:80px 0}
    .hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,48px);letter-spacing:.2px}
    .hero p{margin:0 0 24px;color:var(--muted);max-width:58ch}
  </style>
  <script>
    // prosty toggle dla mobile menu
    document.addEventListener('DOMContentLoaded', ()=>{
      const btn=document.querySelector('#burger'); const drawer=document.querySelector('#drawer');
      btn?.addEventListener('click', ()=> drawer.classList.toggle('open'));
    });
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="#">
        <img alt="" src="https://miniemporium.pl/wp-content/uploads/2025/09/Banner-v2-scaled.jpg">
        <span>Mini Emporium Media</span>
      </a>
      <nav class="navlinks">
        <a href="#work">Work</a>
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a class="cta" href="#get-started">Get Started</a>
      </nav>
      <button id="burger" class="burger" aria-label="Menu">☰</button>
    </div>
    <div id="drawer" class="drawer" aria-hidden="true">
      <div class="inner container">
        <a href="#work">Work</a>
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a class="cta" href="#get-started">Get Started</a>
      </div>
    </div>
  </header>

  <section class="hero container">
    <h1>Transform written content into stunning visuals</h1>
    <p>Harness the power of content + video to grow hospitality, F&B and real estate brands in Malta.</p>
    <a class="cta" href="#get-started">Book discovery call</a>
  </section>
</body>
</html>
